<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Whyno Write promo tile</title>
  <!-- Development only: the 440x280 small promo tile for the Chrome Web Store. -->
  <style>
    html, body { margin: 0; }
    body {
      width: 440px; height: 280px; overflow: hidden; box-sizing: border-box; padding: 36px 36px;
      font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif; color: #16161A;
      background:
        radial-gradient(260px 220px at 0% 0%, rgba(255, 210, 74, 0.55), transparent 70%),
        radial-gradient(300px 260px at 100% 100%, rgba(205, 214, 232, 0.95), transparent 70%),
        #EFEEEA;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
    .brand img { width: 44px; height: 44px; border-radius: 12px; }
    .brand span { font-weight: 450; color: rgba(22, 22, 26, 0.6); }
    h1 { margin: 0; font-size: 32px; line-height: 1.08; letter-spacing: -0.03em; font-weight: 750; }
    .chips { display: flex; gap: 8px; }
    .chip { background: rgba(255, 255, 255, 0.85); border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 600; box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
    .chip.on { background: #FFCC33; color: #1C1500; }
  </style>
</head>
<body>
  <div class="brand"><img src="/icons/icon128.png" alt="">whyno <span>Write</span></div>
  <h1>Write better on<br>every website.</h1>
  <div class="chips"><div class="chip on">Flow</div><div class="chip">Fix</div><div class="chip">Enhance</div></div>
</body>
</html>
