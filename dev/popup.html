<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Whyno Write popup test</title>
  <!-- Development only: renders popup/popup.html with fake extension APIs. ?signedIn=0 for signed out, ?news=1 for the what's-new note. -->
  <style>body { margin: 0; background: #888; display: flex; gap: 24px; padding: 24px; } iframe { width: 360px; height: 860px; border: 0; border-radius: 12px; }</style>
</head>
<body>
  <iframe id="frame" title="popup"></iframe>
  <script>
    const q = new URLSearchParams(location.search);
    const signedIn = q.get("signedIn") !== "0";
    const news = q.get("news") === "1";
    const stub = `<script>
      const mem = {
        whyno_history: [
          { goal: "Fix", text: "Hi Priya, I finished the quarterly report yesterday and will send it tomorrow morning.", at: Date.now() },
          { goal: "Enhance", text: "Write a friendly 600-word blog post for college students about saving money.", at: Date.now() - 60000 }
        ]${news ? ', whyno_whats_new: "1.3.0"' : ""}
      };
      window.chrome = {
        runtime: {
          getManifest: () => ({ version: "1.3.0" }),
          getURL: (p) => "/" + p,
          sendMessage(msg, cb) { setTimeout(() => cb && cb(
            msg.type === "GET_USER" ? { ok: true, modeOverride: "auto", quota: ${signedIn} ? { value: 62, at: Date.now() } : null,
              user: ${signedIn} ? { idToken: "t", displayName: "Vandan Dalvi", email: "vandan@example.com", photoUrl: "" } : null }
            : msg.type === "CHECK_HEALTH" ? { ok: true } : { ok: true }), 50); }
        },
        tabs: {
          create() {},
          query(_q, cb) { cb([{ id: 1 }]); },
          sendMessage(_id, _m, cb) { setTimeout(() => cb({ host: "chatgpt.com", hidden: false }), 30); }
        },
        commands: { getAll(cb) { cb([{ name: "whyno-write", shortcut: "Alt+Shift+F" }, { name: "whyno-flow", shortcut: "Alt+Shift+V" }]); } },
        storage: {
          onChanged: { addListener() {} },
          local: {
            get(keys, cb) { const o = {}; (Array.isArray(keys) ? keys : [keys]).forEach((k) => { if (k in mem) o[k] = mem[k]; }); setTimeout(() => cb(o), 0); },
            set(items, cb) { Object.assign(mem, items); cb && setTimeout(cb, 0); },
            remove(k) { delete mem[k]; }
          }
        }
      };
    <\/script>`;
    fetch("/popup/popup.html").then((r) => r.text()).then((html) => {
      document.getElementById("frame").srcdoc = html.replace("<head>", `<head><base href="/popup/">${stub}`);
    });
  </script>
</body>
</html>
