<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, initial-scale=1">
  <title>Whyno Write showcase</title>
  <!-- Development only: a plain, unbranded mail window and chat box for 1280x800 store screenshots.
       ?demo=launcher | fix | flow-listen | flow-result | signin -->
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      width: 1280px; height: 800px; overflow: hidden;
      font: 15px/1.5 -apple-system, "Segoe UI", Roboto, system-ui, sans-serif; color: #16161A;
      background:
        radial-gradient(600px 500px at 0% 0%, rgba(255, 210, 74, 0.45), transparent 70%),
        radial-gradient(700px 600px at 100% 100%, rgba(205, 214, 232, 0.9), transparent 70%),
        #EFEEEA;
      display: grid; grid-template-columns: 420px 1fr; gap: 40px; padding: 64px 64px 64px 72px;
    }
    .pitch { align-self: center; }
    .pitch img { width: 56px; height: 56px; border-radius: 15px; display: block; margin-bottom: 28px; }
    .pitch h1 { font-size: 44px; line-height: 1.08; letter-spacing: -0.03em; margin: 0; font-weight: 750; }
    .pitch p { font-size: 18px; color: rgba(22, 22, 26, 0.68); margin: 18px 0 0; max-width: 360px; }
    .window {
      align-self: end; height: 560px; position: relative;
      background: #fff; border-radius: 18px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.14), 0 2px 6px rgba(0, 0, 0, 0.06);
      overflow: hidden; display: flex; flex-direction: column;
    }
    .bar { height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 18px; border-bottom: 1px solid #ECECEC; font-weight: 600; font-size: 14px; }
    .dot { width: 11px; height: 11px; border-radius: 50%; background: #E2E2E2; }
    .row { display: flex; gap: 12px; padding: 12px 22px; border-bottom: 1px solid #F1F1F1; color: #6B6B70; font-size: 14px; }
    .row b { color: #16161A; font-weight: 500; }
    textarea {
      border: 0; outline: none; resize: none; font: inherit; font-size: 16px; line-height: 1.6; color: #16161A; background: transparent;
    }
    #mail { flex: 1; padding: 20px 22px; }
    .chat { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 24px; gap: 14px; background: #FAFAF8; }
    .bubble { align-self: flex-start; max-width: 70%; background: #fff; border-radius: 16px; padding: 12px 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.06); color: #444; }
    .composer { background: #fff; border: 1px solid #E4E4E4; border-radius: 18px; padding: 12px 16px; }
    #chat { width: 100%; min-height: 64px; }
    body[data-scene="mail"] .chat-ui, body[data-scene="chat"] .mail-ui { display: none !important; }
  </style>
  <script src="/dev/stub.js"></script>
  <script src="/config.js"></script>
  <script src="/sites.js"></script>
  <script src="/content/content.js" defer></script>
</head>
<body>
  <section class="pitch">
    <img src="/icons/icon128.png" alt="">
    <h1 id="headline"></h1>
    <p id="sub"></p>
  </section>

  <section class="window mail-ui">
    <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span style="margin-left:10px">New message</span></div>
    <div class="row">To <b>Priya Sharma</b></div>
    <div class="row">Subject <b>Quarterly report</b></div>
    <textarea id="mail">hi priya, i has finish the quarterly report yesterday and will sending it tomoro morning after final check. let me know if u need anything else</textarea>
  </section>

  <section class="window chat-ui">
    <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span style="margin-left:10px">Team chat</span></div>
    <div class="chat">
      <div class="bubble">Are we still on for standup at 10 tomorrow?</div>
      <div class="composer"><textarea id="chat" placeholder="Write a message…"></textarea></div>
    </div>
  </section>

  <script>
    const COPY = {
      launcher: ["Write better on every website.", "Whyno sits next to any text box. Tap Fix, Enhance or Flow, and keep writing.", "mail"],
      fix: ["Fix it in one tap.", "Spelling, grammar and clarity, corrected where you type. You choose whether to replace.", "mail"],
      "flow-listen": ["Just say it.", "Tap Flow and talk through what you want to say. Rough is fine.", "chat"],
      "flow-result": ["Get a message ready to send.", "Flow turns your brain dump into clear text. Ask for changes by voice or with one tap.", "chat"],
      signin: ["Free with your Google account.", "Sign in once and Fix, Enhance and Flow work on every site.", "mail"]
    };
    const demo = new URLSearchParams(location.search).get("demo") || "launcher";
    const [headline, sub, scene] = COPY[demo] || COPY.launcher;
    document.body.dataset.scene = scene;
    document.getElementById("headline").textContent = headline;
    document.getElementById("sub").textContent = sub;

    (async () => {
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      await wait(500);
      const s = document.querySelector("whyno-write-host").shadowRoot;
      const field = document.getElementById(scene);
      field.focus();
      field.setSelectionRange(field.value.length, field.value.length);
      await wait(300);
      if (demo === "launcher") return;
      s.querySelector(demo.startsWith("flow") ? "[data-action=flow]" : "[data-action=write]").click();
      await wait(1500);
      if (demo === "flow-result") {
        s.querySelector("[data-action=done]").click();
        await wait(2000);
      }
    })();
  </script>
</body>
</html>
