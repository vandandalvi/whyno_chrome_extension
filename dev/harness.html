<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Whyno Write test page</title>
  <!-- Development only: fakes the extension APIs and the server so the on-page UI can be seen
       and clicked without installing the extension. Not referenced by manifest.json. -->
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 40px 24px 200px; background: #f6f6f3; color: #222; }
    main { max-width: 680px; margin: 0 auto; display: grid; gap: 28px; }
    textarea, [contenteditable] { width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 12px; padding: 12px; font: inherit; background: #fff; min-height: 90px; }
    .chat { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); width: min(680px, calc(100vw - 48px)); }
    label { font-weight: 600; display: block; margin-bottom: 6px; }
    .controls { display: flex; gap: 12px; font-size: 13px; }
  </style>
  <script src="/dev/stub.js"></script>
  <script src="/config.js"></script>
  <script src="/sites.js"></script>
  <script src="/content/content.js" defer></script>
</head>
<body>
  <main>
    <div class="controls">
      <a href="?">Signed in</a> <a href="?signedIn=0">Signed out</a> <a href="?fail=offline">Offline</a> <a href="?mode=ai">Enhance mode</a> <a href="?mic=denied">Mic not allowed</a>
    </div>
    <div>
      <label for="mail">Email body (textarea)</label>
      <textarea id="mail">i has finish the report yesterday, will sending it tomoro morning</textarea>
    </div>
    <div>
      <label>Notes (contenteditable)</label>
      <div contenteditable="true" id="notes">tell team standup moves to 11 tmrw not 10, dentist. camera optional</div>
    </div>
    <p style="height:600px">Scroll space.</p>
  </main>
  <div class="chat">
    <textarea id="chat" placeholder="Message (chat box pinned to the bottom, like ChatGPT)"></textarea>
  </div>
  <script>
    // ?demo=fix | flow-listen | flow-result | signin: opens that state by itself, for store screenshots.
    (async () => {
      const demo = new URLSearchParams(location.search).get("demo");
      if (!demo) return;
      document.querySelector(".controls").style.visibility = "hidden";
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      await wait(500);
      const s = document.querySelector("whyno-write-host").shadowRoot;
      const field = document.getElementById(demo === "fix" || demo === "signin" ? "mail" : "chat");
      field.focus();
      await wait(300);
      if (demo === "launcher") return;
      s.querySelector(demo.startsWith("flow") ? "[data-action=flow]" : "[data-action=write]").click();
      await wait(1500);
      if (demo === "flow-result") {
        s.querySelector("[data-action=done]").click();
        await wait(2000);
      }
    })();
  </script>
</body>
</html>
